name: Qualité et sécurité

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Astro et dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le projet
        run: npm run validate

  semgrep:
    name: Analyse Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Semgrep
        run: pipx install semgrep==1.176.0

      - name: Analyser le code applicatif
        run: semgrep scan --error --metrics=off --config p/javascript --config p/typescript --config p/secrets src astro.config.mjs
